name: Release @charzhu/codepilot

# Triggered by pushing a tag like `codepilot-v0.1.0`.
#
# Required repo secrets:
#   NPM_TOKEN - npm automation token with publish access to @charzhu/codepilot
#
# Required workflow permissions:
#   id-token: write (for npm provenance)
#   contents: read

on:
  push:
    tags:
      - "codepilot-v*"

jobs:
  build-windows-x64:
    name: Build Windows x64 npm tarballs
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^codepilot-v', ''
          if ($version -eq $tag) {
            throw "Tag must start with codepilot-v"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build native binaries
        shell: pwsh
        working-directory: codex-rs
        env:
          # The workspace release profile uses fat LTO and one codegen unit,
          # which can exceed GitHub-hosted Windows runner time limits.
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          cargo build `
            --target x86_64-pc-windows-msvc `
            --release `
            --bin codepilot `
            --bin codex-windows-sandbox-setup `
            --bin codex-command-runner

      - name: Stage npm tarballs
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $repoRoot = $env:GITHUB_WORKSPACE
          $target = 'x86_64-pc-windows-msvc'
          $releaseDir = Join-Path $repoRoot "codex-rs\target\$target\release"
          $vendorRoot = Join-Path $env:RUNNER_TEMP "codepilot-vendor\vendor"
          $targetRoot = Join-Path $vendorRoot $target
          $codexDir = Join-Path $targetRoot 'codex'
          $pathDir = Join-Path $targetRoot 'path'
          New-Item -ItemType Directory -Force -Path $codexDir, $pathDir | Out-Null

          Copy-Item (Join-Path $releaseDir 'codepilot.exe') (Join-Path $codexDir 'codepilot.exe')
          Copy-Item (Join-Path $releaseDir 'codex-windows-sandbox-setup.exe') (Join-Path $codexDir 'codex-windows-sandbox-setup.exe')
          Copy-Item (Join-Path $releaseDir 'codex-command-runner.exe') (Join-Path $codexDir 'codex-command-runner.exe')

          $rgZip = Join-Path $env:RUNNER_TEMP 'ripgrep.zip'
          $rgExtract = Join-Path $env:RUNNER_TEMP 'ripgrep'
          Invoke-WebRequest `
            -Uri 'https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-x86_64-pc-windows-msvc.zip' `
            -OutFile $rgZip
          Expand-Archive -LiteralPath $rgZip -DestinationPath $rgExtract
          $rgExe = Get-ChildItem -Path $rgExtract -Recurse -Filter rg.exe | Select-Object -First 1
          if ($null -eq $rgExe) {
            throw 'Unable to find rg.exe in ripgrep archive'
          }
          Copy-Item $rgExe.FullName (Join-Path $pathDir 'rg.exe')

          $dist = Join-Path $repoRoot 'dist\npm'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          python (Join-Path $repoRoot 'codex-cli\scripts\build_npm_package.py') `
            --package codepilot-win32-x64 `
            --release-version $env:RELEASE_VERSION `
            --vendor-src $vendorRoot `
            --pack-output (Join-Path $dist "codepilot-npm-win32-x64-$env:RELEASE_VERSION.tgz")

          python (Join-Path $repoRoot 'codex-cli\scripts\build_npm_package.py') `
            --package codepilot `
            --release-version $env:RELEASE_VERSION `
            --pack-output (Join-Path $dist "codepilot-npm-$env:RELEASE_VERSION.tgz")

      - name: Upload npm tarballs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codepilot-npm
          path: dist/npm/*.tgz
          if-no-files-found: error

  publish-npm:
    name: Publish npm packages
    needs: build-windows-x64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Download npm tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codepilot-npm
          path: dist/npm

      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build-windows-x64.outputs.version }}
        run: |
          set -euo pipefail

          platform_tarball="dist/npm/codepilot-npm-win32-x64-${VERSION}.tgz"
          root_tarball="dist/npm/codepilot-npm-${VERSION}.tgz"

          for required_tarball in "$platform_tarball" "$root_tarball"; do
            if [[ ! -f "$required_tarball" ]]; then
              echo "Missing npm tarball: $required_tarball"
              exit 1
            fi
          done

          publish_package() {
            local tarball="$1"
            set +e
            output="$(npm publish "$tarball" --access public --provenance --ignore-scripts 2>&1)"
            status=$?
            set -e

            echo "$output"
            if [[ $status -eq 0 ]]; then
              return 0
            fi

            if grep -qiE "previously published|cannot publish over|version already exists" <<< "$output"; then
              echo "Skipping already-published package version for $tarball"
              return 0
            fi

            return "$status"
          }

          publish_package "$platform_tarball"
          publish_package "$root_tarball"
